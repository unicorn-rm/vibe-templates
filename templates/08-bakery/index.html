<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crumb &amp; Co. — Tiny Neighbourhood Bakery</title>
  <meta name="description" content="Hand-drawn pastel bakery template: chalkboard of today's bake with next-batch countdown, allergen filters. Tailwind CSS + Alpine.js." />
  <meta name="theme-color" content="#fff6e9" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ffd98a' stroke='%235a3e36' stroke-width='2'/%3E%3Cpath d='M10 14l2 4M16 11l1 5M21 14l-1 4' stroke='%235a3e36' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
</head>
<body x-data="bakery" class="bg-cream text-cocoa font-body antialiased">
  <!-- SVG filter that makes borders look hand-drawn -->
  <svg width="0" height="0" class="absolute" aria-hidden="true"><filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" /><feDisplacementMap in="SourceGraphic" scale="3" /></filter></svg>

  <header class="mx-auto flex max-w-6xl items-center gap-6 px-5 py-5">
    <a href="#top" class="flex items-center gap-2 font-hand text-3xl font-bold">
      <svg viewBox="0 0 80 70" class="h-9 w-10 doodle" aria-hidden="true"><path :d="doodle('loaf')" /></svg>
      Crumb &amp; Co.
    </a>
    <nav class="ml-auto hidden gap-6 font-semibold sm:flex" aria-label="Primary">
      <a href="#today" class="squiggle" x-text="t.nav.menu"></a>
      <a href="#shop" class="squiggle" x-text="t.nav.shop"></a>
      <a href="#visit" class="squiggle" x-text="t.nav.visit"></a>
    </nav>
    <button @click="lang = lang === 'en' ? 'ru' : 'en'" class="sketch ml-auto bg-butter px-3 py-1 font-hand text-xl sm:ml-0" aria-label="Switch language" x-text="lang === 'en' ? 'RU' : 'EN'"></button>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="mx-auto grid max-w-6xl items-center gap-10 px-5 pt-8 pb-16 md:grid-cols-[1.2fr_1fr]">
      <div>
        <p class="font-hand text-2xl text-berry" x-text="t.hero.k"></p>
        <h1 class="mt-2 font-hand text-6xl leading-[0.9] font-bold sm:text-8xl">
          <span x-text="t.hero.h1"></span><br />
          <span class="marker" x-text="t.hero.h2"></span>
        </h1>
        <p class="mt-6 max-w-[44ch] text-lg" x-text="t.hero.lead"></p>
        <a href="#today" class="sketch mt-8 inline-block bg-cocoa px-6 py-3 font-extrabold text-cream transition-transform hover:-rotate-2" x-text="t.hero.cta + ' ↓'"></a>
      </div>
      <div class="relative h-80 sm:h-96" aria-hidden="true">
        <div class="note absolute top-2 left-4 w-48 -rotate-6 bg-berry/70 p-4"><svg viewBox="0 0 80 70" class="doodle w-full"><path :d="doodle('croissant')" /></svg></div>
        <div class="note absolute top-24 right-0 w-52 rotate-3 bg-butter p-4"><svg viewBox="0 0 80 70" class="doodle w-full"><path :d="doodle('loaf')" /></svg></div>
        <div class="note absolute bottom-0 left-16 w-40 rotate-[-2deg] bg-mint p-4"><svg viewBox="0 0 80 70" class="doodle w-full"><path :d="doodle('cookie')" /></svg></div>
        <span class="absolute right-10 bottom-8 rotate-6 font-hand text-2xl" x-text="t.hero.note"></span>
      </div>
    </section>

    <!-- CHALKBOARD (signature) -->
    <section id="today" class="mx-auto max-w-6xl px-5 pb-20">
      <div class="chalkboard sketch relative px-6 py-8 sm:px-12 sm:py-12">
        <div class="flex flex-wrap items-end justify-between gap-4 border-b-2 border-dashed border-chalk/40 pb-4">
          <h2 class="font-hand text-5xl font-bold text-chalk sm:text-6xl" x-text="t.board.title"></h2>
          <p class="font-hand text-2xl text-butter" x-show="next">
            <span x-text="t.board.next"></span>
            <b class="ml-1 tabular-nums text-chalk" x-text="next?.left"></b>
            <span class="text-chalk/70" x-text="'(' + t.board.fresh + ' ' + next?.at + ')'"></span>
          </p>
          <p class="font-hand text-2xl text-butter" x-show="!next" x-text="t.board.done"></p>
        </div>
        <ul class="mt-6 grid gap-x-10 gap-y-3 font-hand text-3xl text-chalk sm:grid-cols-2">
          <template x-for="p in products" :key="p.id">
            <li class="flex items-baseline gap-3" :class="p.soldOut && 'opacity-60'">
              <span class="relative" :class="p.soldOut && 'chalk-strike'" x-text="p[lang].n"></span>
              <span class="flex-1 border-b-2 border-dotted border-chalk/40"></span>
              <span x-text="p.soldOut ? t.board.out : price(p)" :class="p.soldOut ? 'text-berry text-2xl' : 'text-butter'"></span>
            </li>
          </template>
        </ul>
        <div class="mt-8 flex gap-3 font-hand text-2xl text-chalk/80">
          <template x-for="b in batches"><span class="rounded-full border-2 border-chalk/50 px-3" x-text="b"></span></template>
        </div>
      </div>
    </section>

    <!-- SHOP grid with allergen filters -->
    <section id="shop" class="mx-auto max-w-6xl px-5 pb-20">
      <h2 class="font-hand text-6xl font-bold" x-text="t.shop.title"></h2>
      <div class="mt-5 flex flex-wrap gap-3" role="group" aria-label="Allergen filters">
        <button @click="active = []" class="sketch px-4 py-1.5 font-semibold" :class="!active.length ? 'bg-cocoa text-cream' : 'bg-white'" x-text="t.shop.all"></button>
        <template x-for="tag in tags" :key="tag">
          <button @click="toggle(tag)" :aria-pressed="active.includes(tag)" class="sketch px-4 py-1.5 font-semibold" :class="active.includes(tag) ? 'bg-mint' : 'bg-white'" x-text="(active.includes(tag) ? '✓ ' : '') + t.shop.tags[tag]"></button>
        </template>
      </div>
      <ul class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
        <template x-for="(p, i) in shown" :key="p.id">
          <li class="card sketch relative bg-white p-5" :style="`--r:${[-1.5, 1, -0.5, 1.5][i % 4]}deg`">
            <div class="grid h-32 place-items-center rounded-[40%_60%_55%_45%/50%_45%_55%_50%]" :class="['bg-butter/60', 'bg-berry/30', 'bg-mint/60', 'bg-sky/50'][i % 4]">
              <svg viewBox="0 0 80 70" class="doodle h-20"><path :d="doodle(p.icon)" /></svg>
            </div>
            <h3 class="mt-4 text-lg font-extrabold" x-text="p[lang].n"></h3>
            <p class="text-sm opacity-75" x-text="p[lang].d"></p>
            <div class="mt-3 flex items-center justify-between">
              <span class="font-hand text-3xl font-bold" x-text="price(p)"></span>
              <span class="flex gap-1">
                <template x-for="tag in p.tags"><span class="rounded-full bg-cream px-2 text-xs font-bold" x-text="t.shop.tags[tag]"></span></template>
              </span>
            </div>
            <span x-show="p.soldOut" class="stamp absolute top-4 right-3 rotate-12 px-2 font-hand text-2xl text-berry" x-text="t.shop.sold"></span>
          </li>
        </template>
      </ul>
      <p x-show="!shown.length" class="mt-6 font-hand text-3xl" x-text="t.shop.empty"></p>
    </section>

    <!-- HOW -->
    <section class="mx-auto max-w-6xl px-5 pb-20">
      <h2 class="font-hand text-6xl font-bold" x-text="t.how.title"></h2>
      <ol class="mt-8 grid gap-8 md:grid-cols-3">
        <template x-for="(s, i) in t.how.steps" :key="i">
          <li class="relative">
            <span class="font-hand text-7xl font-bold text-berry" x-text="i + 1"></span>
            <h3 class="font-hand text-4xl font-bold" x-text="s[0]"></h3>
            <p x-text="s[1]"></p>
            <svg x-show="i < 2" viewBox="0 0 120 40" class="doodle absolute top-6 -right-6 hidden w-24 md:block" aria-hidden="true"><path d="M4 26 C30 6 70 6 100 22 M88 12 L102 22 L90 32" /></svg>
          </li>
        </template>
      </ol>
    </section>

    <!-- NOTES -->
    <section class="mx-auto max-w-6xl px-5 pb-20">
      <h2 class="font-hand text-6xl font-bold" x-text="t.notes"></h2>
      <div class="mt-8 grid gap-8 md:grid-cols-3">
        <template x-for="(n, i) in notes">
          <figure class="note p-6" :class="{ pink: 'bg-berry/40', butter: 'bg-butter', mint: 'bg-mint' }[n.c]" :style="`rotate:${[-3, 2, -1][i]}deg`">
            <blockquote class="font-hand text-3xl leading-tight" x-text="n[lang]"></blockquote>
            <figcaption class="mt-3 font-bold" x-text="n.by"></figcaption>
          </figure>
        </template>
      </div>
    </section>

    <!-- VISIT -->
    <section id="visit" class="mx-auto grid max-w-6xl gap-10 px-5 pb-20 md:grid-cols-2 md:items-center">
      <div>
        <h2 class="font-hand text-6xl font-bold" x-text="t.visit.title"></h2>
        <p class="mt-3 text-xl font-semibold" x-text="t.visit.addr"></p>
        <p class="mt-1 font-hand text-3xl text-berry" x-text="t.visit.hours"></p>
      </div>
      <figure class="sketch bg-white p-4">
        <svg viewBox="0 0 300 180" class="doodle w-full" aria-hidden="true">
          <path d="M10 60 L290 60 M10 120 L290 120 M90 10 L90 170 M210 10 L210 170" stroke-dasharray="6 6" />
          <path d="M130 70 L170 70 L170 110 L130 110 Z" fill="#ffd98a" />
          <path d="M150 40 C150 30 160 26 166 30 M150 70 L150 52" />
          <path d="M40 140 C50 130 60 130 70 140 C60 150 50 150 40 140 Z M240 30 C250 20 262 22 268 32 C258 42 246 40 240 30 Z" fill="#a8e6cf" />
        </svg>
        <figcaption class="font-hand text-xl opacity-70"><span x-text="t.visit.map"></span> · <b>Crumb &amp; Co. ★</b></figcaption>
      </figure>
    </section>
  </main>

  <footer class="border-t-2 border-dashed border-cocoa/30">
    <div class="mx-auto flex max-w-6xl flex-wrap justify-between gap-3 px-5 py-6 text-sm">
      <span class="font-hand text-2xl font-bold">Crumb &amp; Co.</span>
      <span x-text="t.foot"></span>
      <a href="#top" class="font-bold">↑</a>
    </div>
  </footer>
</body>
</html>
